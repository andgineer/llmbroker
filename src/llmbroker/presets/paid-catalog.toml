# Curated paid providers and their current flagship models.
# Read by `llmbroker list` and by `direct=`.
#
# Model ids below were read from each provider's own authoritative docs on the
# `verified` date. Re-run `src/llmbroker/presets/paid-catalog-refresh-prompt.md` to refresh
# them and add more providers (Mistral, ...).
# refreshed = "2026-08-16"

[[provider]]
id          = "anthropic"
label       = "Anthropic (Claude)"
base_url    = "https://api.anthropic.com/v1"                 # OpenAI-compatible endpoint
api_key_ref = "ANTHROPIC_API_KEY"
key_help    = "Create a key at https://console.anthropic.com/ (paid)."

  [[provider.models]]
  alias    = "opus"
  model    = "claude-opus-5"
  label    = "Claude Opus 5 — recommended default for complex agentic coding and enterprise work"
  verified = "https://platform.claude.com/docs/en/docs/about-claude/models/overview (2026-08-16)"

  [[provider.models]]
  alias    = "fable"
  model    = "claude-fable-5"
  label    = "Claude Fable 5 — most capable, for long-running agents"
  verified = "https://platform.claude.com/docs/en/docs/about-claude/models/overview (2026-08-16)"

  [[provider.models]]
