# Curated paid providers and their current flagship models.
# Consumed by `llmbroker add-model`.
#
# Model ids below were read from each provider's own authoritative docs on the
# `verified` date. Re-run `presets/paid-catalog-refresh-prompt.md` to refresh
# them and add more providers (xAI, Mistral, DeepSeek, ...).
# refreshed = "2026-07-20"

[[provider]]
id          = "anthropic"
label       = "Anthropic (Claude)"
base_url    = "https://api.anthropic.com/v1"                 # OpenAI-compatible endpoint
api_key_ref = "ANTHROPIC_API_KEY"
key_help    = "Create a key at https://console.anthropic.com/ (paid)."

  [[provider.models]]
  alias    = "opus"
  model    = "claude-opus-4-8"
  label    = "Claude Opus 4.8 — recommended default for complex agentic/enterprise work"
  verified = "https://platform.claude.com/docs/en/docs/about-claude/models/overview (2026-07-20)"

  [[provider.models]]
  alias    = "fable"
  model    = "claude-fable-5"
  label    = "Claude Fable 5 — most capable, for long-running agents"
  verified = "https://platform.claude.com/docs/en/docs/about-claude/models/overview (2026-07-20)"

  [[provider.models]]
  alias    = "sonnet"
  model    = "claude-sonnet-5"
  label    = "Claude Sonnet 5 — best speed/intelligence balance, lower cost"
  verified = "https://platform.claude.com/docs/en/docs/about-claude/models/overview (2026-07-20)"

